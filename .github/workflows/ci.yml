name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: proxy/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r proxy/requirements.txt
      - name: Run Python tests
        run: python -m pytest tests/

  extension-tests:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        run: npm ci --prefix extension
      - name: Type-check extension
        run: npm run typecheck --prefix extension
      - name: Test extension
        run: npm test --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
