<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>語意層延遲實測（R1 / R2）</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0 auto; padding: 24px; max-width: 820px;
        font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
        font-size: 14px; line-height: 1.6; color: #0f172a; background: #fff;
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      .sub { margin: 0 0 18px; color: #64748b; font-size: 13px; }
      fieldset { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
      legend { font-size: 12px; font-weight: 650; color: #64748b; padding: 0 6px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #475569; }
      select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; }
      button {
        font: inherit; font-size: 13px; font-weight: 600; padding: 8px 18px;
        border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      button:disabled { background: #94a3b8; cursor: default; }
      pre#log {
        margin: 0; padding: 11px; height: 220px; overflow-y: auto;
        background: #0f172a; color: #cbd5e1; border-radius: 8px;
        font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.55;
        white-space: pre-wrap; word-break: break-all;
      }
      table { border-collapse: collapse; width: 100%; margin: 14px 0 0; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #f1f5f9; }
      th { background: #f8fafc; font-size: 12px; color: #475569; }
      td:first-child { color: #64748b; width: 42%; }
      tr.hl td { background: #eff6ff; }
      .verdict { margin-top: 12px; padding: 11px 13px; border-radius: 9px; font-weight: 600; font-size: 13px; }
      .verdict.good { background: #dcfce7; color: #166534; }
      .verdict.warn { background: #fef3c7; color: #92400e; }
      .verdict.bad  { background: #fee2e2; color: #b91c1c; }
      .fail { padding: 12px; background: #fee2e2; color: #7f1d1d; border-radius: 9px; font-size: 13px; }
      .note { font-size: 12px; color: #64748b; }
      code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 11.5px; word-break: break-all; }
      .ctx { font-size: 12.5px; color: #475569; background: #f8fafc; border-left: 3px solid #cbd5e1; padding: 10px 13px; border-radius: 0 8px 8px 0; margin: 0 0 16px; }
      .ctx b { color: #0f172a; }
    </style>
  </head>
  <body>
    <h1>語意層延遲實測</h1>
    <p class="sub">對應專題報告風險清單 R1（MV3 能不能載入模型）與 R2（延遲會不會超過 1 秒）</p>

    <div class="ctx">
      <b>已知的參照點：</b>規則層（本擴充）2 千字 <b>0.11 ms</b>；
      同一個 NER 模型在 <b>PyTorch CPU</b> 上對 2800 字是 <b>約 2412 ms</b>，
      proxy 端因此把語意層預設關閉。<br />
      這一頁要量的是：<b>同樣的事情在瀏覽器裡差多少。</b>
    </div>

    <fieldset>
      <legend>設定</legend>
      <div class="row">
        <label>
          後端
          <select id="backend">
            <option value="wasm">WASM（CPU）</option>
            <option value="webgpu">WebGPU</option>
          </select>
        </label>
        <label>
          量化
          <select id="dtype">
            <option value="q8">q8（int8，約 170 MB）</option>
            <option value="fp32">fp32（未量化，約 677 MB）</option>
            <option value="fp16">fp16（約 339 MB）</option>
          </select>
        </label>
        <label>
          文字長度
          <select id="length">
            <option value="2800">2800 字（對齊 PyTorch 端的量測）</option>
            <option value="500">500 字（一般貼上）</option>
            <option value="1000">1000 字</option>
          </select>
        </label>
        <button id="run">開始實測</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>執行紀錄</legend>
      <pre id="log"></pre>
    </fieldset>

    <div id="result"></div>

    <script type="module" src="benchmark.js"></script>
  </body>
</html>
